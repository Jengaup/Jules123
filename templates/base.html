<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contabilidad Iglesia PR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 p-4 text-white">
        <div class="container mx-auto flex justify-between">
            <a href="{{ url_for('index') }}" class="font-bold text-xl">Iglesia Contable PR</a>
            <div>
                {% if current_user.is_authenticated %}
                <a href="{{ url_for('index') }}" class="px-3">Dashboard</a>
                <a href="{{ url_for('minister_compensation') }}" class="px-3">Ministros</a>
                <a href="{{ url_for('logout') }}" class="px-3 text-red-200">Salir</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="bg-green-200 text-green-800 p-2 mb-4 rounded">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
